<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Все виды тортов</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <div class="logo">Виды тортов</div>
    <nav>
        <a href="index.html" class="active">Главная</a>
        <a href="cake1.html">Медовик</a>
        <a href="cake2.html">Наполеон</a>
        <a href="cake3.html">Шоколадный</a>
        <a href="cake4.html">Птичье молоко</a>
        <a href="cake5.html">Чизкейк</a>
    </nav>
</header>

<main>
    <div class="video-wrap">
        <video id="mainVideo" controls autoplay>
            <source src="videos/vid.MOV" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <section class="gallery">
        <h2>Выберите торт для подробностей</h2>
        <div class="cards">
            <a class="card" href="cake1.html">
                <img src="images/medovik.jpg" alt="Медовик">
                <div class="card-title">Медовик</div>
            </a>
            <a class="card" href="index.html?start=90">
                <img src="images/napoleon.webp" alt="Наполеон">
                <div class="card-title">Наполеон</div>
            </a>
            <a class="card" href="cake3.html">
                <img src="images/chocolate_biscuit" alt="Шоколадный торт">
                <div class="card-title">Шоколадный</div>
            </a>
            <a class="card" href="cake4.html">
                <img src="images/ptichye_moloko.webp" alt="Птичье молоко">
                <div class="card-title">Птичье молоко</div>
            </a>

            <a class="card" href="cake5.html">
                <img src="images/cheesecake.png" alt="Чизкейк">
                <div class="card-title">Чизкейк</div>
            </a>
        </div>
    </section>
</main>

<footer>© 2025 Все права защищены.</footer>

</html>
